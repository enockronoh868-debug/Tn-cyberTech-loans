<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN CyberTech</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #000000; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; overflow: hidden; }
        
        .logo-container { display: flex; align-items: center; gap: 10px; }
        
        /* CSS Gold Logo Icon */
        .icon { position: relative; width: 80px; height: 80px; }
        .sq { position: absolute; background: linear-gradient(135deg, #FFD700, #B8860B); border-radius: 4px; }
        .sq1 { width: 20px; height: 20px; top: 0; left: 0; }
        .sq2 { width: 20px; height: 20px; top: 25px; left: 0; }
        .sq3 { width: 20px; height: 20px; top: 10px; left: 25px; }
        .u-shape { position: absolute; width: 50px; height: 60px; bottom: 0; right: 0; border-left: 12px solid #FFD700; border-bottom: 12px solid #FFD700; border-bottom-left-radius: 20px; border-right: 12px solid #FFD700; border-top: 12px solid #FFD700; border-top-right-radius: 20px; }

        .text-container { display: flex; flex-direction: column; align-items: flex-start; }
        .text-tn { font-size: 28px; font-weight: bold; color: #FFD700; line-height: 1; }
        .text-cyber { font-size: 32px; font-weight: bold; color: #FFD700; line-height: 1; }
        .text-bank { font-size: 18px; color: #FFD700; line-height: 1.2; }

        .loading-dot { margin-top: 60px; font-size: 30px; color: white; animation: blink 1s infinite alternate; }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="icon">
            <div class="sq sq1"></div>
            <div class="sq sq2"></div>
            <div class="sq sq3"></div>
            <div class="u-shape"></div>
        </div>
        <div class="text-container">
            <div class="text-tn">TN</div>
            <div class="text-cyber">CyberTech</div>
            <div class="text-bank">Bank Limited</div>
        </div>
    </div>
    <div class="loading-dot">|</div>

    <script>
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 2000);
    </script>
</body>
                                                 </html>
