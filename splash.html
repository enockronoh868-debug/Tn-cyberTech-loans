<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN CyberTech</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #000000; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; overflow: hidden; }
        
        .logo-container { display: flex; align-items: center; gap: 12px; }
        
        .icon { position: relative; width: 70px; height: 70px; }
        .sq { position: absolute; background: linear-gradient(135deg, #FFD700, #B8860B); border-radius: 4px; }
        .sq1 { width: 16px; height: 16px; top: 0; left: 0; }
        .sq2 { width: 16px; height: 16px; top: 22px; left: 0; }
        .sq3 { width: 16px; height: 16px; top: 8px; left: 22px; }
        .u-shape { position: absolute; width: 38px; height: 48px; bottom: 0; right: 0; border-left: 12px solid #FFD700; border-bottom: 12px solid #FFD700; border-bottom-left-radius: 12px; border-right: 12px solid #FFD700; border-top: 12px solid #FFD700; border-top-right-radius: 12px; }

        .text-container { display: flex; flex-direction: column; align-items: flex-start; }
        .text-tn { font-size: 28px; font-weight: 900; color: #FFD700; line-height: 1; letter-spacing: 1px;}
        .text-cyber { font-size: 34px; font-weight: 900; color: #FFD700; line-height: 1; letter-spacing: -1px;}
        .text-bank { font-size: 18px; font-weight: 600; color: #FFD700; line-height: 1.2; }

        .loading-dot { margin-top: 60px; font-size: 24px; color: #FFD700; animation: blink 1s infinite alternate; }
        @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="icon">
            <div class="sq sq1"></div>
            <div class="sq sq2"></div>
            <div class="sq sq3"></div>
            <div class="u-shape"></div>
        </div>
        <div class="text-container">
            <div class="text-tn">TN</div>
            <div class="text-cyber">CyberTech</div>
            <div class="text-bank">Bank Limited</div>
        </div>
    </div>
    <div class="loading-dot">|</div>

    <script>
        // Stays for exactly 2 seconds, then goes to the Welcome page
        setTimeout(function() {
            window.location.href = 'welcome.html'; 
        }, 2000);
    </script>
</body>
  </html>
