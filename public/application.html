<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN CyberTech - Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background-color: #f4f7f9; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 400px; background: white; min-height: 100vh; padding-bottom: 30px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        .header { padding: 15px 20px; border-bottom: 2px solid #FFD700; display: flex; justify-content: space-between; align-items: center; }
        
        .logo-container { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-main { font-family: "Times New Roman", Times, serif; font-weight: 900; font-size: 22px; color: #000; letter-spacing: -0.5px; line-height: 1; }
        .logo-sub { font-size: 10px; font-weight: 700; color: #B8860B; margin-top: 2px;}

        .user-icon { font-size: 24px; color: #0A2240; text-align: center;}
        .welcome-text { font-size: 12px; font-weight: 600; color: #333; text-align: right;}

        .content { padding: 20px; }
        .title { text-align: center; margin-bottom: 5px; font-size: 22px; color: #0A2240; font-weight: 700; }
        .subtitle { text-align: center; font-size: 11px; color: #666; margin-bottom: 25px; line-height: 1.5; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; color: #333; margin-bottom: 8px; font-weight: 500;}
        .form-control { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; color: #333; outline: none; background: white; }
        .form-control:focus { border-color: #B8860B; }
        
        select.form-control { appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 10px auto; }

        .checkbox-group { display: flex; align-items: flex-start; margin: 20px 0; }
        .checkbox-group input { margin-right: 10px; margin-top: 3px; width: 16px; height: 16px; accent-color: #B8860B; }
        .checkbox-group label { font-size: 12px; color: #555; line-height: 1.4; }

        .btn-main { width: 100%; background: linear-gradient(90deg, #D4AF37, #FFDF00, #D4AF37); color: #000; font-size: 16px; font-weight: 700; padding: 16px; border: none; border-radius: 8px; cursor: pointer; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-container">
                <div class="logo-main">TN CyberTech</div>
                <div class="logo-sub">Bank Limited</div>
            </div>
            <div>
                <div class="user-icon">👤</div>
                <div class="welcome-text">Welcome</div>
            </div>
        </div>

        <div class="content">
            <div class="title">Loan Application</div>
            <div class="subtitle">Please fill in all required details accurately. All information is kept confidential and used only for loan processing and verification only.</div>

            <form onsubmit="submitForm(event)">
                <div class="form-group">
                    <label>Full name</label>
                    <input type="text" class="form-control" id="fullName" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="form-control" id="phoneNumber" placeholder="0785345678" required>
                </div>

                <div class="form-group">
                    <label>National ID</label>
                    <input type="text" class="form-control" id="nationalId" required>
                </div>

                <div class="form-group">
                    <label>Loan Amount (USD)</label>
                    <input type="text" class="form-control" id="loanAmount" value="10,000" required>
                </div>

                <div class="form-group">
                    <label>Employment Status</label>
                    <select class="form-control" id="employmentStatus">
                        <option>Self-Employed</option>
                        <option>Employed</option>
                        <option>Unemployed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Monthly Net Income</label>
                    <input type="number" class="form-control" id="monthlyIncome" placeholder="USD 0.00" required>
                </div>

                <div class="form-group">
                    <label>Repayment</label>
                    <select class="form-control" id="repaymentTerm">
                        <option>6 months</option>
                        <option>12 months</option>
                        <option>24 months</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I confirm that the information provided is true and I agree to the TN CyberTech Bank Loans terms and conditions.</label>
                </div>

                <button type="submit" class="btn-main">SUBMIT APPLICATION</button>
            </form>
        </div>
    </div>

    <script>
        function submitForm(e) {
            e.preventDefault();
            
            // Store phone number for the next pages
            let phone = document.getElementById('phoneNumber').value;
            sessionStorage.setItem('userPhone', phone);
            
            // Go to Splash Page next
            window.location.href = 'splash.html';
        }
    </script>
</body>
  </html>
